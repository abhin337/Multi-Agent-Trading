[project]
name = "nse-multi-agent-trader"
version = "0.1.0"
description = "Least-privilege 3-agent NSE trading pipeline with Gemini API, read-only NSE MCP, deterministic guardrails, HITL gate, and isolated Zerodha execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "kiteconnect>=5.2.2",
    "mcp>=2.3.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
